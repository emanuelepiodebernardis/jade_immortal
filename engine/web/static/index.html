<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jade Immortal</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/fx.css">
<link rel="stylesheet" href="/static/stage.css">
<link rel="stylesheet" href="/static/cmdbar.css">
<link rel="stylesheet" href="/static/daotree.css">
<script>try { const t = localStorage.getItem("ji_theme"); if (t) document.documentElement.dataset.theme = t;
  if (localStorage.getItem("ji_cb") === "1") document.documentElement.dataset.cb = "1"; } catch (e) {}</script>
<link rel="stylesheet" href="/static/ui80.css">
</head>
<body>
<header id="topbar">
  <div class="who">
    <span class="lv" id="t-lv" title="Livello: (regno − 1) × 10 + strato">Lv —</span>
    <div><strong id="t-nome">—</strong><div id="t-regno" class="muted">—</div></div>
  </div>
  <div class="meters">
    <div class="meter" title="Esperienza dello strato"><span>ESP</span><div class="bar"><i id="b-esp"></i></div><em id="v-esp"></em></div>
    <div class="meter" title="Qi"><span>QI</span><div class="bar qi"><i id="b-qi"></i></div><em id="v-qi"></em></div>
    <div class="meter" title="Spirito"><span>SPI</span><div class="bar sp"><i id="b-sp"></i></div><em id="v-sp"></em></div>
  </div>
  <div class="chips-top">
    <span class="chip" id="t-cuore" title="Cuore del Dao">—</span>
    <span class="chip" id="t-ferite" title="Ferite">—</span>
    <span class="chip" id="t-pietre" title="Pietre spirituali e fama">—</span>
    <span class="chip pts" id="t-punti" title="Punti attributo da distribuire (menu Attributi)" hidden>—</span>
  </div>
  <div class="chip muted when" id="t-tempo">—</div>
</header>

<main id="layout">
  <nav id="rail" aria-label="I palazzi">
    <button data-palace="oggi" title="Cosa fare oggi, le mete, il calendario"><span class="ic">🏯</span><span class="lb">Oggi</span><span class="dot" hidden></span></button>
    <button data-palace="via" title="La tua Via: coltivazione, corpo, sangue, Dao, tecniche, anime, forza"><span class="ic">☯</span><span class="lb">La Via</span><span class="dot" hidden></span></button>
    <button data-palace="setta" title="Setta, bacheca, arti, dimora, rendite, dominio"><span class="ic">⛩</span><span class="lb">Setta</span><span class="dot" hidden></span></button>
    <button data-palace="seguaci" title="Cloni, discepoli, legami, famiglia, faide"><span class="ic">👥</span><span class="lb">Seguaci</span><span class="dot" hidden></span></button>
    <button data-palace="mondo" title="Mappa, mercato, aste, regni, razze, mondo di sotto"><span class="ic">🌍</span><span class="lb">Mondo</span><span class="dot" hidden></span></button>
    <button data-palace="tesori" title="Zaino e Libro"><span class="ic">🎒</span><span class="lb">Tesori</span><span class="dot" hidden></span></button>
    <button data-palace="storia" title="Cronaca, trama, mondo"><span class="ic">📜</span><span class="lb">Storia</span><span class="dot" hidden></span></button>
    <button data-palace="opzioni" class="opt" title="Pilota automatico, difficoltà, salvataggi"><span class="ic">⚙</span><span class="lb">Opzioni</span></button>
    <button data-cmd="salva" class="save" title="Salva la partita"><span class="ic">💾</span><span class="lb">Salva</span></button>
  </nav>

  <section id="center">
    <div id="altar" class="card">
      <div class="ring" id="ring" title="Esperienza dello strato"><svg viewBox="0 0 120 120"><circle class="rb" cx="60" cy="60" r="52"/><circle class="rf" id="ring-f" cx="60" cy="60" r="52"/></svg>
        <div class="rt"><b id="ring-pct">—</b><small id="ring-sub">strato</small></div></div>
      <div class="altar-main">
        <div class="altar-head"><b id="altar-realm">—</b><span class="muted" id="altar-where"></span></div>
        <div class="altar-acts" id="quick">
          <button class="primary big" id="primary" data-cmd="train">☯ Allenati</button>
          <button data-cmd="breakthrough" id="q-sfonda" title="Tenta lo sfondamento">⇑ Sfonda</button>
          <button data-cmd="tribulation" id="q-trib" title="Una tribolazione divina ti aspetta" hidden>⚡ Tribolazione</button>
          <button data-cmd="tempra" id="q-tempra" title="Tempra lo spirito: la terza via">🌀 Tempra</button>
          <button data-cmd="spiriti allena" id="q-spiriti" title="Allenati con gli Spiriti del Dao" hidden>✺ Spiriti</button>
          <button data-cmd="sleep" id="q-sonno" title="Dormi fino all'alba: recuperi Qi e spirito">☾ Dormi</button>
          <button data-cmd="raccogli" id="q-raccogli" title="Raccogli il bottino e assorbi essenze, nuclei, manuali e incensi">✋ Raccogli</button>
          <button data-cmd="tesori cura" id="q-cura" title="Nutre anello, pagoda, calderone, semina lo spazio interiore">✧ Cura tesori</button>
        </div>
        <div class="altar-auto"><span>✧ Pilota</span><input id="auto-giorni" type="number" min="1" max="60" value="7" title="giorni"><span class="muted">giorni</span>
          <button id="auto-go">▶ Avvia</button><button id="auto-stop" hidden>■ Interrompi</button>
          <button class="link" data-palace="opzioni" title="Impostazioni del pilota">impostazioni</button></div>
      </div>
    </div>
    <div id="todo"></div>
    <div id="place" class="card"></div>
    <div id="logfilter" role="toolbar" aria-label="Filtra il registro">
      <button class="chip on" data-logf="tutto">Tutto</button><button class="chip" data-logf="combattimento">⚔ Combattimento</button><button class="chip" data-logf="coltivazione">☯ Coltivazione</button><button class="chip" data-logf="legami">♥ Legami</button><button class="chip" data-logf="setta">⛩ Setta</button><button class="chip" data-logf="mondo">✦ Mondo</button>
    </div>
    <div id="log" aria-live="polite"></div>
    <div id="advbar" hidden><button id="adv" title="Mostra il pezzo successivo (Spazio, oppure Invio con la casella vuota)">▸ Avanti <kbd>Spazio</kbd> <small></small></button><button id="adv-all" class="link" title="Mostra subito tutto il testo in attesa">mostra tutto</button></div>
    <div id="scene" class="card scene" hidden></div>
    <div id="sugg"></div>
    <form id="cmdform" autocomplete="off">
      <input id="cmd" placeholder="Scrivi un comando (train, mete, vai 1, attack nome, osserva nome)… — 'help' per l'elenco" autofocus>
      <button type="button" id="palbtn" title="Vai ovunque e cerca tutto (Ctrl+K oppure /)">🔎</button>
      <button type="button" id="voicebtn" title="Modalità voce: comanda il gioco parlando">🎙</button>
      <button type="button" id="narrbtn" title="Narratore: legge ad alta voce">🔈</button>
      <button class="primary">Invia</button>
    </form>
  </section>

  <aside id="side">
    <div id="phead"><b id="ptitle">Oggi</b>
      <span class="ptools"><button id="settings-btn" title="Impostazioni: testo, contrasto, lettura, musica, suoni, tema">⚙</button>
        <div id="settings-pop" hidden role="menu" aria-label="Impostazioni">
          <b>Impostazioni</b>
          <button id="fontsz"><span class="si">A±</span><span class="sl">Grandezza del testo</span><em></em></button>
          <button id="contrast"><span class="si">◐</span><span class="sl">Alto contrasto</span><em></em></button>
          <button id="readmode"><span class="si">📖</span><span class="sl">Lettura</span><em></em></button>
          <button id="music"><span class="si">🎵</span><span class="sl">Musica d'atmosfera</span><em></em></button>
          <button id="sound"><span class="si">🔊</span><span class="sl">Suoni</span><em></em></button>
          <button id="ambtoggle"><span class="si">🌿</span><span class="sl">Suoni d'ambiente (vento, pioggia, campane…)</span><em></em></button>
          <div class="narr-opts"><span class="sl">Volume dell'ambiente</span><input id="ambvol" type="range" min="0" max="1" step="0.05" value="0.35"><em id="ambvol-v">35%</em></div>
          <button id="mgtoggle"><span class="si">🔨</span><span class="sl">Minigiochi di forgia</span><em></em></button>
          <button id="theme"><span class="si">☾</span><span class="sl">Tema</span><em></em></button>
          <button id="widen"><span class="si">⤢</span><span class="sl">Pannello largo</span><em></em></button>
          <button id="stagetoggle"><span class="si">🏞</span><span class="sl">Luogo come scena di gioco</span><em></em></button>
          <button id="voicetoggle"><span class="si">🎙</span><span class="sl">Modalità voce (comandi parlati)</span><em></em></button>
          <button id="narrtoggle"><span class="si">🗣</span><span class="sl">Narratore e voci dei personaggi</span><em></em></button>
          <div class="narr-opts"><span class="sl">Velocità della voce</span><input id="narrspeed" type="range" min="0.6" max="1.8" step="0.1" value="1"><em id="narrspeed-v">1,0×</em></div>
          <button id="cbtoggle"><span class="si">◐</span><span class="sl">Modalità daltonici (segni oltre ai colori)</span><em></em></button>
          <button id="fxtoggle"><span class="si">✨</span><span class="sl">Effetti e animazioni</span><em></em></button>
        </div></span></div>
    <div id="subnav" class="subtabs"></div>
    <div id="tabbody"></div>
  </aside>
</main>

<div id="toasts" aria-live="polite"></div>
<div id="overlay" hidden><div class="modal" id="modal"></div></div>
<script src="/static/viz.js"></script>
<script src="/static/icons.js"></script>
<script src="/static/fx.js"></script>
<script src="/static/stage.js"></script>
<script src="/static/narrator.js"></script>
<script src="/static/cmdbar.js"></script>
<script src="/static/ambient.js"></script>
<script src="/static/daotree.js"></script>
<script src="/static/app.js"></script>
</body>
</html>

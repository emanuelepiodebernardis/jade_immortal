<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jade Immortal</title>
<link rel="stylesheet" href="/static/style.css">
<script>try { const t = localStorage.getItem("ji_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header id="topbar">
  <div class="who">
    <span class="lv" id="t-lv" title="Livello: (regno − 1) × 10 + strato">Lv —</span>
    <div><strong id="t-nome">—</strong><div id="t-regno" class="muted">—</div></div>
  </div>
  <div class="meters">
    <div class="meter" title="Esperienza dello strato"><span>ESP</span><div class="bar"><i id="b-esp"></i></div><em id="v-esp"></em></div>
    <div class="meter" title="Qi"><span>QI</span><div class="bar qi"><i id="b-qi"></i></div><em id="v-qi"></em></div>
    <div class="meter" title="Spirito"><span>SPI</span><div class="bar sp"><i id="b-sp"></i></div><em id="v-sp"></em></div>
  </div>
  <div class="chips-top">
    <span class="chip" id="t-cuore" title="Cuore del Dao">—</span>
    <span class="chip" id="t-ferite" title="Ferite">—</span>
    <span class="chip" id="t-pietre" title="Pietre spirituali e fama">—</span>
    <span class="chip pts" id="t-punti" title="Punti attributo da distribuire (menu Attributi)" hidden>—</span>
  </div>
  <div class="chip muted when" id="t-tempo">—</div>
</header>

<main id="layout">
  <nav id="actions" aria-label="Azioni e menu">
    <div class="quick" id="quick">
      <button data-cmd="train" title="Qi, Dao e arte insieme (t)">☯ Allenati</button>
      <button data-cmd="tempra" id="q-tempra" title="Tempra lo spirito: la terza via">🌀 Tempra</button>
      <button data-cmd="spiriti allena" id="q-spiriti" title="Allenati con gli Spiriti del Dao" hidden>✺ Spiriti</button>
      <button data-cmd="sleep" id="q-sonno" title="Dormi fino all'alba: recuperi Qi e spirito">☾ Dormi</button>
      <button data-cmd="breakthrough" id="q-sfonda" title="Tenta lo sfondamento">⇑ Sfonda</button>
      <button data-cmd="tribulation" id="q-trib" title="Una tribolazione divina ti aspetta" hidden>⚡ Tribolazione</button>
      <button data-cmd="raccogli" id="q-raccogli" title="Raccogli il bottino e assorbi essenze, nuclei, manuali e incensi">✋ Raccogli</button>
      <button data-cmd="tesori cura" title="Cura di tutti i tesori">✧ Cura tesori</button>
    </div>
    <details class="grp" open><summary>☯ La Via</summary>
      <button data-menu="coltivazione">☯ Coltivazione</button>
      <button data-menu="attributi">🪟 Attributi <span class="badge" id="nav-punti" hidden></span></button>
      <button data-menu="tecniche">⚒ Tecniche</button>
      <button data-menu="profondi">🌌 Dao profondi</button>
      <button data-menu="spiriti">✺ Spiriti del Dao</button>
      <button data-menu="sangue">🩸 Sangue</button>
    </details>
    <details class="grp" open><summary>⛩ Potere</summary>
      <button data-menu="setta">⛩ Setta</button>
      <button data-menu="dominio">⛓ Dominio</button>
      <button data-menu="rendite">💰 Rendite</button>
      <button data-menu="dimora">⌂ Dimora</button>
      <button data-menu="arti">⚗ Arti</button>
      <button data-menu="ricette">📜 Ricette</button>
      <button data-menu="bacheca">📋 Bacheca</button>
    </details>
    <details class="grp" open><summary>🌍 Mondo</summary>
      <button data-menu="mercato">🏪 Mercato</button>
      <button data-menu="asta">⚖ Casa d'aste</button>
      <button data-menu="eventi">✦ Eventi</button>
      <button data-menu="regni">👑 Regni</button>
      <button data-menu="razze">🐉 Razze</button>
      <button data-menu="famiglia">🏠 Famiglia</button>
      <button data-menu="faide">⚔ Faide</button>
    </details>
    <details class="grp auto"><summary>✧ Pilota automatico</summary>
      <div class="row"><input id="auto-giorni" type="number" min="1" max="60" value="7"><span>giorni</span></div>
      <button id="auto-go" class="primary">▶ Avvia</button>
      <button id="auto-stop" hidden>■ Interrompi</button>
      <label>Bersagli <select data-auto="bersagli">
        <option>nessuno</option><option>bestie</option><option>ricercati</option><option>deboli</option><option>tutti</option>
      </select></label>
      <label>Condotta <select data-auto="condotta">
        <option>virtuosa</option><option>prudente</option><option>opportunista</option><option>spietata</option>
      </select></label>
      <label><input type="checkbox" data-auto="sfonda"> Sfonda da solo</label>
      <label>Rischio <input type="number" min="0" max="100" data-auto="rischio"> %</label>
      <label><input type="checkbox" data-auto="assorbi"> Divora i caduti</label>
      <label><input type="checkbox" data-auto="loot"> Raccogli il bottino</label>
      <label><input type="checkbox" data-auto="oggetti"> Usa pillole ed essenze</label>
      <label><input type="checkbox" data-auto="routine"> Faccende (stipendio, missioni)</label>
      <label><input type="checkbox" data-auto="potenzia"> Potenzia la dimora</label>
      <label><input type="checkbox" data-auto="setta"> Setta: iscriviti e ascendi</label>
    </details>
    <button data-cmd="salva" title="Salva la partita" class="save">💾 Salva</button>
  </nav>

  <section id="center">
    <div id="place" class="card"></div>
    <div id="logfilter" role="toolbar" aria-label="Filtra il registro">
      <button class="chip on" data-logf="tutto">Tutto</button><button class="chip" data-logf="combattimento">⚔ Combattimento</button><button class="chip" data-logf="coltivazione">☯ Coltivazione</button><button class="chip" data-logf="legami">♥ Legami</button><button class="chip" data-logf="setta">⛩ Setta</button><button class="chip" data-logf="mondo">✦ Mondo</button>
    </div>
    <div id="log" aria-live="polite"></div>
    <div id="scene" class="card scene" hidden></div>
    <div id="sugg"></div>
    <form id="cmdform" autocomplete="off">
      <input id="cmd" placeholder="Scrivi un comando (train, mete, vai 1, attack nome, osserva nome)… — 'help' per l'elenco" autofocus>
      <button class="primary">Invia</button>
    </form>
  </section>

  <aside id="side">
    <div id="tabs" role="tablist">
      <button data-tab="mete" class="on" title="Mete, obiettivi e missioni">🎯 Mete</button>
      <button data-tab="personaggio" title="Finestra di stato, Dao, radici, corpo, sangue, crescita">🪟 Eroe</button>
      <button data-tab="mappa" title="La mappa">🗺 Mappa</button>
      <button data-tab="persone" title="Alleati, nemici e la rete delle relazioni">♥ Legami</button>
      <button data-tab="tesori" title="Zaino e Libro">🎒 Tesori</button>
      <button data-tab="storia" title="Cronaca, trama e mondo">📜 Storia</button>
      <button data-tab="aiuto" title="Salvataggi, rinascita, legenda">⚙</button>
      <button id="sound" title="Suoni discreti: sì / no">🔊</button>
      <button id="theme" title="Tema: automatico, chiaro, scuro">◐</button>
      <button id="widen" title="Allarga o restringi il pannello">⤢</button>
    </div>
    <div id="tabbody"></div>
  </aside>
</main>

<div id="toasts" aria-live="polite"></div>
<div id="overlay" hidden><div class="modal" id="modal"></div></div>
<script src="/static/viz.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
